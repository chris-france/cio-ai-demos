<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Device Discovery Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']}}}}</script>
    <style>body{font-family:'Inter',sans-serif;}.kpi-card{transition:transform .15s ease;}.kpi-card:hover{transform:translateY(-2px);}</style>
</head>
<body class="bg-white text-gray-900 antialiased">
    <header class="bg-gradient-to-r from-slate-900 via-slate-800 to-slate-900 text-white px-8 py-6">
        <div class="max-w-[1600px] mx-auto"><h1 class="text-2xl font-extrabold">AI-Powered Device Discovery</h1>
        <p class="text-slate-300 text-sm mt-1">Network Scanner &amp; Asset Reconciliation</p></div>
    </header>
    <main class="max-w-[1600px] mx-auto px-8 py-6 space-y-6">
        <section class="grid grid-cols-2 md:grid-cols-5 gap-4" id="kpiCards"></section>

        <section class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm">
                <h3 class="text-sm font-semibold text-gray-700 mb-4">Discovered Devices by Subnet</h3>
                <div style="height:300px"><canvas id="subnetChart"></canvas></div>
            </div>
            <div class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm">
                <h3 class="text-sm font-semibold text-gray-700 mb-4">Device Count Trend &mdash; 30 Days</h3>
                <div style="height:300px"><canvas id="trendChart"></canvas></div>
            </div>
        </section>

        <section class="bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-100"><h3 class="text-sm font-semibold text-gray-700">Reconciliation Results</h3></div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead><tr class="bg-gray-50 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">
                        <th class="px-4 py-3">IP Address</th><th class="px-4 py-3">MAC</th><th class="px-4 py-3">Fingerprinted OS</th>
                        <th class="px-4 py-3">Subnet</th><th class="px-4 py-3">In CMDB</th><th class="px-4 py-3">Classification</th>
                    </tr></thead>
                    <tbody id="reconBody"></tbody>
                </table>
            </div>
        </section>

        <footer class="text-center text-xs text-gray-400 py-6 border-t border-gray-100">
            AI Device Discovery &mdash; Course 19 &mdash; Lecture 2 &mdash; Confidential
        </footer>
    </main>
<script>
const SCAN = [
    { ip: '10.1.1.15', mac: 'AA:BB:CC:11:22:33', os: 'Windows 11', subnet: '10.1.1.0/24', inCmdb: true, class: 'Known' },
    { ip: '10.1.1.22', mac: 'AA:BB:CC:11:22:44', os: 'Windows 11', subnet: '10.1.1.0/24', inCmdb: true, class: 'Known' },
    { ip: '10.1.1.45', mac: 'AA:BB:CC:11:22:55', os: 'macOS', subnet: '10.1.1.0/24', inCmdb: true, class: 'Known' },
    { ip: '10.1.1.98', mac: 'DE:AD:BE:EF:00:01', os: 'Linux (Ubuntu)', subnet: '10.1.1.0/24', inCmdb: false, class: 'Unknown' },
    { ip: '10.1.2.10', mac: 'AA:BB:CC:22:33:44', os: 'Windows Server 2022', subnet: '10.1.2.0/24', inCmdb: true, class: 'Known' },
    { ip: '10.1.2.20', mac: 'AA:BB:CC:22:33:55', os: 'RHEL 9', subnet: '10.1.2.0/24', inCmdb: true, class: 'Known' },
    { ip: '10.1.3.5', mac: 'AA:BB:CC:33:44:55', os: 'iOS 19', subnet: '10.1.3.0/24', inCmdb: true, class: 'Known' },
    { ip: '10.1.3.18', mac: 'FF:EE:DD:CC:BB:AA', os: 'Android 14', subnet: '10.1.3.0/24', inCmdb: false, class: 'Rogue' },
    { ip: '10.1.3.42', mac: 'DE:AD:BE:EF:00:02', os: 'Unknown (IoT)', subnet: '10.1.3.0/24', inCmdb: false, class: 'Rogue' },
    { ip: '10.1.4.8', mac: 'AA:BB:CC:44:55:66', os: 'Printer Firmware', subnet: '10.1.4.0/24', inCmdb: false, class: 'Unknown' },
    { ip: '10.1.4.12', mac: 'AA:BB:CC:44:55:77', os: 'Camera Firmware', subnet: '10.1.4.0/24', inCmdb: false, class: 'Unknown' },
    { ip: '10.1.1.67', mac: 'AA:BB:CC:11:67:88', os: 'Windows 10', subnet: '10.1.1.0/24', inCmdb: true, class: 'Known' },
];

const known = SCAN.filter(s=>s.class==='Known').length;
const unknown = SCAN.filter(s=>s.class==='Unknown').length;
const rogue = SCAN.filter(s=>s.class==='Rogue').length;

const KPI = [
    { label: 'Devices in CMDB', value: '20', color: '#3b82f6' },
    { label: 'Discovered', value: SCAN.length, color: '#8b5cf6' },
    { label: 'Unmatched', value: unknown + rogue, color: '#ef4444' },
    { label: 'Rogue Alerts', value: rogue, color: '#f59e0b' },
    { label: 'Coverage', value: '92%', color: '#10b981' },
];
document.getElementById('kpiCards').innerHTML = KPI.map(k =>
    `<div class="kpi-card border border-gray-200 rounded-xl p-5 shadow-sm" style="border-top:3px solid ${k.color}">
        <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider">${k.label}</span>
        <div class="text-3xl font-extrabold mt-2" style="color:${k.color}">${k.value}</div></div>`
).join('');

const subnets = {};
SCAN.forEach(s => { subnets[s.subnet] = (subnets[s.subnet]||0)+1; });
new Chart(document.getElementById('subnetChart'), {
    type: 'bar',
    data: { labels: Object.keys(subnets), datasets: [{ label: 'Devices', data: Object.values(subnets), backgroundColor: ['#3b82f6','#8b5cf6','#10b981','#f59e0b'], borderRadius: 6 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
});

const days = Array.from({length:30},(_,i)=>'Day '+(i+1));
const counts = [18,18,18,19,19,19,19,20,20,20,20,20,21,21,21,22,22,22,22,23,23,23,24,24,24,24,25,25,25,25];
new Chart(document.getElementById('trendChart'), {
    type: 'line',
    data: { labels: days, datasets: [{ label: 'Active Devices', data: counts, borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,0.08)', fill: true, tension: 0.3 }] },
    options: { responsive: true, maintainAspectRatio: false }
});

document.getElementById('reconBody').innerHTML = SCAN.map(s => {
    const classBadge = s.class==='Known' ? 'bg-green-100 text-green-700' : s.class==='Rogue' ? 'bg-red-100 text-red-700' : 'bg-amber-100 text-amber-700';
    return `<tr class="border-t border-gray-100 hover:bg-gray-50 ${s.class!=='Known'?'bg-red-50':''}">
        <td class="px-4 py-3 font-mono text-xs">${s.ip}</td><td class="px-4 py-3 font-mono text-xs">${s.mac}</td>
        <td class="px-4 py-3">${s.os}</td><td class="px-4 py-3">${s.subnet}</td>
        <td class="px-4 py-3">${s.inCmdb?'Yes':'No'}</td>
        <td class="px-4 py-3"><span class="px-2 py-0.5 text-xs rounded-full ${classBadge} font-semibold">${s.class}</span></td></tr>`;
}).join('');
</script>
</body>
</html>
