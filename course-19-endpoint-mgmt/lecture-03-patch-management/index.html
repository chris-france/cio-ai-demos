<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patch Management Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']}}}}</script>
    <style>body{font-family:'Inter',sans-serif;}.kpi-card{transition:transform .15s ease;}.kpi-card:hover{transform:translateY(-2px);}</style>
</head>
<body class="bg-white text-gray-900 antialiased">
    <header class="bg-gradient-to-r from-slate-900 via-slate-800 to-slate-900 text-white px-8 py-6">
        <div class="max-w-[1600px] mx-auto"><h1 class="text-2xl font-extrabold">Patch Management Dashboard</h1>
        <p class="text-slate-300 text-sm mt-1">Compliance by OS &amp; Criticality</p></div>
    </header>
    <main class="max-w-[1600px] mx-auto px-8 py-6 space-y-6">
        <section class="grid grid-cols-2 md:grid-cols-5 gap-4" id="kpiCards"></section>

        <section class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm">
                <h3 class="text-sm font-semibold text-gray-700 mb-4">Compliance by OS</h3>
                <div style="height:300px"><canvas id="osChart"></canvas></div>
            </div>
            <div class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm">
                <h3 class="text-sm font-semibold text-gray-700 mb-4">Patch Age Distribution</h3>
                <div style="height:300px"><canvas id="ageChart"></canvas></div>
            </div>
        </section>

        <section class="bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-100"><h3 class="text-sm font-semibold text-gray-700">Critical Patches Pending</h3></div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead><tr class="bg-gray-50 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">
                        <th class="px-4 py-3">CVE ID</th><th class="px-4 py-3">Severity</th><th class="px-4 py-3">Affected Devices</th>
                        <th class="px-4 py-3">Days Since Release</th><th class="px-4 py-3">Status</th><th class="px-4 py-3">Risk Score</th>
                    </tr></thead>
                    <tbody id="patchBody"></tbody>
                </table>
            </div>
        </section>

        <section class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm">
            <h3 class="text-sm font-semibold text-gray-700 mb-4">Patch Velocity &mdash; 12 Weeks</h3>
            <div style="height:250px"><canvas id="velocityChart"></canvas></div>
        </section>

        <footer class="text-center text-xs text-gray-400 py-6 border-t border-gray-100">
            Patch Management &mdash; Course 19 &mdash; Lecture 3 &mdash; Confidential
        </footer>
    </main>
<script>
const KPI = [
    { label: 'Total Endpoints', value: '187', color: '#3b82f6' },
    { label: 'Patch Compliance', value: '78%', color: '#10b981' },
    { label: 'Critical Pending', value: '12', color: '#ef4444' },
    { label: 'Avg Patch Age', value: '14 days', color: '#f59e0b' },
    { label: '30+ Day Patches', value: '23', color: '#8b5cf6' },
];
document.getElementById('kpiCards').innerHTML = KPI.map(k =>
    `<div class="kpi-card border border-gray-200 rounded-xl p-5 shadow-sm" style="border-top:3px solid ${k.color}">
        <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider">${k.label}</span>
        <div class="text-3xl font-extrabold mt-2" style="color:${k.color}">${k.value}</div></div>`
).join('');

new Chart(document.getElementById('osChart'), {
    type: 'bar',
    data: {
        labels: ['Windows 11', 'Windows 10', 'macOS', 'Linux', 'Windows Server'],
        datasets: [
            { label: 'Patched', data: [82, 45, 28, 12, 8], backgroundColor: '#10b981', borderRadius: 4 },
            { label: 'Unpatched', data: [8, 15, 2, 3, 4], backgroundColor: '#ef4444', borderRadius: 4 },
        ]
    },
    options: { responsive: true, maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true } } }
});

new Chart(document.getElementById('ageChart'), {
    type: 'bar',
    data: {
        labels: ['0-7 days', '8-14 days', '15-30 days', '30+ days'],
        datasets: [{ label: 'Devices', data: [98, 42, 24, 23], backgroundColor: ['#10b981','#3b82f6','#f59e0b','#ef4444'], borderRadius: 6 }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
});

const PATCHES = [
    { cve: 'CVE-2026-1234', severity: 'Critical', affected: 45, days: 8, status: 'In Progress', risk: 9.2 },
    { cve: 'CVE-2026-1189', severity: 'Critical', affected: 32, days: 15, status: 'Scheduled', risk: 8.8 },
    { cve: 'CVE-2026-0987', severity: 'High', affected: 67, days: 22, status: 'Testing', risk: 7.5 },
    { cve: 'CVE-2026-0876', severity: 'High', affected: 23, days: 35, status: 'Blocked', risk: 7.1 },
    { cve: 'CVE-2025-9823', severity: 'Critical', affected: 12, days: 45, status: 'Exception', risk: 8.5 },
    { cve: 'CVE-2026-1345', severity: 'Medium', affected: 89, days: 5, status: 'In Progress', risk: 5.2 },
];
document.getElementById('patchBody').innerHTML = PATCHES.map(p => {
    const sevColor = p.severity==='Critical'?'bg-red-100 text-red-700':p.severity==='High'?'bg-amber-100 text-amber-700':'bg-blue-100 text-blue-700';
    const statusColor = p.status==='Blocked'||p.status==='Exception'?'text-red-600 font-semibold':p.status==='In Progress'?'text-blue-600':'text-gray-600';
    return `<tr class="border-t border-gray-100 hover:bg-gray-50 ${p.days>30?'bg-red-50':''}">
        <td class="px-4 py-3 font-mono text-xs">${p.cve}</td>
        <td class="px-4 py-3"><span class="px-2 py-0.5 text-xs rounded-full ${sevColor} font-semibold">${p.severity}</span></td>
        <td class="px-4 py-3 font-semibold">${p.affected}</td>
        <td class="px-4 py-3 ${p.days>30?'text-red-600 font-semibold':''}">${p.days}</td>
        <td class="px-4 py-3 ${statusColor}">${p.status}</td>
        <td class="px-4 py-3 font-bold ${p.risk>=8?'text-red-600':p.risk>=6?'text-amber-600':'text-blue-600'}">${p.risk}</td></tr>`;
}).join('');

const weeks = Array.from({length:12},(_,i)=>'W'+(i+1));
new Chart(document.getElementById('velocityChart'), {
    type: 'line',
    data: { labels: weeks, datasets: [{ label: 'Patches Applied', data: [45,52,38,61,55,72,48,65,70,58,82,75], borderColor: '#3b82f6', tension: 0.3 }] },
    options: { responsive: true, maintainAspectRatio: false }
});
</script>
</body>
</html>
